<article class="tarjeta" [class.agotado]="!producto().disponible">
  <div class="foto">
    @if (producto().imagenUrl) {
      <img [src]="producto().imagenUrl" [alt]="producto().nombre" loading="lazy" />
    } @else {
      <span class="estrella" aria-hidden="true"></span>
    }
    @if (!producto().disponible) {
      <span class="sello">Agotado</span>
    }
  </div>

  <div class="cuerpo">
    <h3>{{ producto().nombre }}</h3>
    @if (producto().descripcion) {
      <p class="descripcion">{{ producto().descripcion }}</p>
    }
    <div class="pie">
      <strong class="precio">{{ producto().precio | bs }}</strong>
      <ng-content />
    </div>
  </div>
</article>
