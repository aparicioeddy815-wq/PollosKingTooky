<div class="login-page">
  <!-- Header con logo y boton de volver -->
  <header class="login-header">
    <div class="logo-box" (click)="goToMenu()">
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuChdKtt6gNN-wtM-lZL21PoSBcAbpLiJzKZdVaO1gSSI93J6uR2mxX-0VZWAl8Kbfy9KqC42D41_BCnGaBrx_oZNMYEK_OaCiZplquWGv9yU-XnAVjaFxEP7KNh0bnErBEEI0tp_Zky12uv5ClgjY27VgwMcOPpBOooMogPC1ZZ1EfYvbvv4bbz6G7xewqDZb1xHcZ38TUY-E0UPsuInSdWKgq1IKm41uKam-FGR5gnMn1-sIWwmmM6AGeiyQKMamglNw" alt="King Tooky Logo" class="logo-img">
    </div>
    <button class="btn-back" (click)="goToMenu()">
      <svg class="icon-home" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Volver al inicio</span>
    </button>
  </header>

  <!-- Contenido principal, diseño de dos columnas -->
  <main class="login-main">
    <div class="login-container-card">

      <!-- Lado derecho (Imagen de Pollo Frito) -->
      <div class="visual-showcase">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrtcoqJ1DTPQDCCziXLybP_V81dUu8rJ2e6X_MUpHVpAkvEYoO7pMcP_2V5iXpVRdJGUBkP3G1uEtkKxcBeB1DYXbyrsmN2BimwG5OhwjKtdne0uEcBIlIQiUyflfdfMl8ZmmwQ0ouS04Tp7402tC4pfJ4EzLbk6GqJk35JKI0jQAcTOlpkeEPC8vbvsTkjEQxQnIEso475DWSvVJqz5AUKf5iCOTOs7y1lSEs0gnkh71ebAOpWG0ujkphnT1JuP8X5A" alt="Pollo frito King Tooky">
      </div>

      <!-- Lado izquierdo (Formulario) -->
      <div class="login-section">
        <div class="form-content-wrapper">

          <div class="form-header">
            <span class="club-badge">
              <svg class="star-icon" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
              Club King Tooky
            </span>
            <h1>¡Bienvenido a <span class="highlight-red">King Tooky</span>!</h1>
            <p>Inicia sesión para realizar tus reservas</p>
          </div>

          <!-- Pestañas de Autenticación -->
          <div class="auth-tabs">
            <button type="button" [class.active]="isLoginTab" (click)="isLoginTab = true">Iniciar Sesión</button>
            <button type="button" [class.active]="!isLoginTab" (click)="isLoginTab = false">Registrarse</button>
          </div>

          <form (ngSubmit)="onLogin()" class="auth-form">
            <div class="field-group">
              <label for="identifier">Usuario o Correo electrónico</label>
              <div class="input-container">
                <span class="field-icon">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                </span>
                <input
                  type="text"
                  id="identifier"
                  [(ngModel)]="username"
                  name="identifier"
                  placeholder="Ej: admin o cliente@gmail.com"
                  required
                >
              </div>
            </div>

            <div class="field-group">
              <label for="password">Contraseña</label>
              <div class="input-container">
                <span class="field-icon">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                </span>
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  id="password"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="••••••••"
                  required
                >
                <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-label">
                <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
                <span>Recordarme</span>
              </label>
              <a class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <div *ngIf="errorMessage" class="error-alert">
              ⚠️ {{ errorMessage }}
            </div>

            <button type="submit" class="submit-btn" [disabled]="isLoading">
              <span *ngIf="!isLoading">Ingresar a mi cuenta</span>
              <span *ngIf="isLoading">Verificando...</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
            </button>
          </form>

          <div class="divider-section">
            <span>O ingresa rápido con</span>
          </div>

          <div class="google-container">
            <button type="button" class="google-btn">
              <svg class="h-4 w-4" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
              </svg>
              <span>Continuar con Google</span>
            </button>
          </div>

        </div>
      </div>

    </div>
  </main>
</div>
