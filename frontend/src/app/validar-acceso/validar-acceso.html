<div class="login-wrapper">
  <div class="login-card">

    <div class="login-left">
      <div class="logo-container">
        <img src="/logo-tokky.webp" alt="King Tooky Logo" class="brand-logo">
      </div>

      <p class="welcome-text">Inicia sesión para acceder al sistema</p>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
          <label for="usuario">Usuario o Correo</label>
          <input
            type="text"
            id="usuario"
            name="nombreUsuario"
            [(ngModel)]="credentials.nombreUsuario"
            placeholder="Ej: admin"
            required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="contrasena"
            [(ngModel)]="credentials.contrasena"
            placeholder="••••••••"
            required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>
    </div>

    <div class="login-right">
      <div class="overlay-text">
        <h2>KING TOOKY</h2>
        <p>Sistema de gestión para restaurante y control de pedidos.</p>
      </div>
    </div>

  </div>
</div>
